name: zero-mem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - name: Parse PowerShell lifecycle scripts
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1','install-online.ps1','uninstall.ps1','uninstall-online.ps1','test/install-smoke.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

  windows-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, uninstall, failed-update rollback
        shell: pwsh
        run: ./test/install-smoke.ps1

  kilo-base-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kilo-base
          path: kilo
      - name: Verify required Kilo public contracts
        shell: bash
        run: |
          grep -q '"experimental.chat.messages.transform"' kilo/packages/plugin/src/index.ts
          grep -q '"experimental.chat.system.transform"' kilo/packages/plugin/src/index.ts
          grep -q '"experimental.session.compacting"' kilo/packages/plugin/src/index.ts
          grep -q 'serverUrl: URL' kilo/packages/plugin/src/index.ts
          grep -q 'session.compacted' kilo/packages/sdk/js/src/gen/types.gen.ts
          grep -q 'session.deleted' kilo/packages/sdk/js/src/gen/types.gen.ts
          grep -q 'public messages<' kilo/packages/sdk/js/src/gen/sdk.gen.ts
          grep -q 'projectID: Schema.optional(Schema.String)' kilo/packages/opencode/src/server/routes/instance/httpapi/groups/experimental.ts
          grep -q 'worktrees: Schema.optional(QueryBoolean)' kilo/packages/opencode/src/server/routes/instance/httpapi/groups/experimental.ts
          grep -q 'WorktreeFamily.list()' kilo/packages/opencode/src/server/routes/instance/httpapi/handlers/experimental.ts
          grep -q 'url: "/experimental/session"' kilo/packages/sdk/js/src/v2/gen/sdk.gen.ts
          grep -q 'filters sessions by repo worktree family even when project IDs drift' kilo/packages/opencode/test/server/experimental-session-list.test.ts
          grep -q 'command: "plugin <module>"' kilo/packages/opencode/src/cli/cmd/plug.ts
          grep -q 'type: "tool"' kilo/packages/sdk/js/src/gen/types.gen.ts
